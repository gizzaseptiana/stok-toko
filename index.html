<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calvin Klein - Stok Pakaian</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>👔 CALVIN KLEIN</h1>
        <div class="brand">Premium <span>CLOTHING</span> Store</div>

        <div class="form-section">
            <h3 id="form-title">Tambah Pakaian Baru</h3>
            <form id="product-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="product-name">Nama Pakaian</label>
                        <input type="text" id="product-name" placeholder="Contoh: CK Slim Fit Shirt" required>
                    </div>
                    <div class="form-group">
                        <label for="product-category">Kategori</label>
                        <select id="product-category">
                            <option value="Kemeja">👕 Kemeja</option>
                            <option value="Kaos">👚 Kaos</option>
                            <option value="Jaket">🧥 Jaket</option>
                            <option value="Celana">👖 Celana</option>
                            <option value="Dress">👗 Dress</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="product-price">Harga (Rp)</label>
                    <input type="number" id="product-price" placeholder="Contoh: 2500000" required>
                </div>
                <button type="submit" id="submit-btn">Tambah Pakaian</button>
                <button type="button" id="cancel-btn" style="background-color:#7f8c8d; display:none;">Batal</button>
            </form>
        </div>

        <div class="product-list">
            <h3>Daftar Pakaian Calvin Klein</h3>
            <div id="products-container">
                <div class="loading">🔄 Memuat data pakaian...</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
